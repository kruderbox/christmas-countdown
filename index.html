<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e63946;
    --gold: #ffd166;
    --glass: rgba(8, 16, 44, 0.5);
    --line: rgba(255, 255, 255, 0.22);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #030817;
    color: #fff;
    font-family: 'Fredoka', system-ui, sans-serif;
    user-select: none;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .countdown {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 920px);
    text-align: center;
    pointer-events: none;
  }
  h1 {
    margin: 0 0 0.35em;
    font-family: 'Mountains of Christmas', cursive;
    font-size: clamp(2.3rem, 7vw, 5.2rem);
    line-height: 1.05;
    text-shadow: 0 0 22px rgba(255, 90, 90, 0.75), 0 4px 0 #7a0010;
  }
  .units { display: flex; gap: clamp(8px, 2vw, 22px); justify-content: center; }
  .unit {
    min-width: clamp(66px, 17vw, 156px);
    padding: 0.55em 0.4em 0.6em;
    border-radius: 18px;
    background: var(--glass);
    border: 2px solid var(--line);
    backdrop-filter: blur(6px);
    box-shadow: 0 0 28px rgba(90, 255, 180, 0.16), inset 0 -4px 0 rgba(255, 255, 255, 0.06);
  }
  .num {
    font-size: clamp(2rem, 7.5vw, 4.6rem);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 14px rgba(255, 255, 255, 0.45);
  }
  .lbl {
    margin-top: 0.45em;
    font-size: clamp(0.68rem, 1.6vw, 1rem);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.85;
  }
  /* Subscriber counter, top-right */
  .subs {
    position: fixed;
    top: 16px;
    right: 16px;
    padding: 4px;
    border-radius: 18px;
    background: repeating-linear-gradient(45deg, var(--red) 0 10px, #fff 10px 20px);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    cursor: pointer;
  }
  .subs-inner {
    min-width: 170px;
    padding: 10px 16px 12px;
    border-radius: 14px;
    background: rgba(10, 18, 46, 0.92);
    text-align: center;
  }
  .subs-label {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .subs-num {
    font-size: 2.3rem;
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .subs-num.bump { animation: bump 0.6s ease; }
  @keyframes bump { 40% { transform: scale(1.18); color: var(--gold); } }
  @media (max-width: 700px) {
    .subs-inner { min-width: 130px; padding: 8px 12px 10px; }
    .subs-num { font-size: 1.7rem; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="countdown">
  <h1 id="title">Countdown to Christmas</h1>
  <div class="units">
    <div class="unit"><div class="num" id="d">00</div><div class="lbl">Days</div></div>
    <div class="unit"><div class="num" id="h">00</div><div class="lbl">Hours</div></div>
    <div class="unit"><div class="num" id="m">00</div><div class="lbl">Minutes</div></div>
    <div class="unit"><div class="num" id="s">00</div><div class="lbl">Seconds</div></div>
  </div>
</div>

<div class="subs" id="subs" title="Click to set the subscriber count">
  <div class="subs-inner">
    <div class="subs-label" id="subsLabel">🔔 Subscribers</div>
    <div class="subs-num" id="subsNum">0</div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ---------------- Countdown ---------------- */
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');

  function christmasTarget(now) {
    const y = now.getFullYear();
    // Once Dec 26 arrives, count toward next year's Christmas
    if (now >= new Date(y, 11, 26)) return new Date(y + 1, 11, 25);
    return new Date(y, 11, 25);
  }

  function tick() {
    const now = new Date();
    const target = christmasTarget(now);
    let diff = target - now;
    if (diff <= 0) {
      $('title').textContent = '🎄 Merry Christmas! 🎄';
      $('d').textContent = $('h').textContent = $('m').textContent = $('s').textContent = '00';
      return;
    }
    $('title').textContent = 'Countdown to Christmas';
    const secs = Math.floor(diff / 1000);
    $('d').textContent = pad(Math.floor(secs / 86400));
    $('h').textContent = pad(Math.floor(secs / 3600) % 24);
    $('m').textContent = pad(Math.floor(secs / 60) % 60);
    $('s').textContent = pad(secs % 60);
  }
  tick();
  setInterval(tick, 250);

  /* ---------------- Subscriber counter ---------------- */
  const params = new URLSearchParams(location.search);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
  };
  const toInt = (v) => parseInt(String(v || '').replace(/[^\d]/g, ''), 10) || 0;

  const CHANNEL_ID = params.get('channel') || 'UCNYM52mSE9rXyaJ3gQkVb2w';
  // 243 = last count seen on the channel; replaced as soon as YouTube answers
  let subs = toInt(params.get('subs') ?? store.get('xmas-subs')) || 243;
  let shown = subs;
  if (params.get('label')) $('subsLabel').textContent = params.get('label');

  function setSubs(n) {
    if (n !== subs) {
      const el = $('subsNum');
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }
    subs = n;
    store.set('xmas-subs', n);
  }

  $('subsNum').textContent = shown.toLocaleString();

  // Manual fallback if YouTube can't be reached
  $('subs').addEventListener('click', () => {
    const v = prompt('Subscriber count:', String(subs));
    if (v === null || v.trim() === '') return;
    setSubs(toInt(v));
  });

  // "1.25K" -> 1250
  function parseCount(text) {
    const m = String(text).replace(/,/g, '').match(/([\d.]+)\s*([KMB])?/i);
    if (!m) return 0;
    const mult = { K: 1e3, M: 1e6, B: 1e9 }[(m[2] || '').toUpperCase()] || 1;
    return Math.round(parseFloat(m[1]) * mult);
  }

  // Live count from your YouTube channel.
  // With ?key=YOUR_API_KEY it uses the official API (works anywhere, exact count).
  // Without a key it reads the public channel page (works when installed as the browser add-on).
  const ytKey = params.get('key');
  async function fetchYouTube() {
    try {
      if (ytKey) {
        const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${encodeURIComponent(CHANNEL_ID)}&key=${encodeURIComponent(ytKey)}`;
        const data = await (await fetch(url)).json();
        const n = toInt(data.items?.[0]?.statistics?.subscriberCount);
        if (n) setSubs(n);
        return;
      }
      const html = await (await fetch(`https://www.youtube.com/channel/${CHANNEL_ID}?hl=en`)).text();
      const m = html.match(/"content":"([\d.,]+\s*[KMB]?) subscribers?"/i)
        || html.match(/"subscriberCountText":\{"simpleText":"([\d.,]+\s*[KMB]?) subscribers?"/i);
      if (m) setSubs(parseCount(m[1]));
    } catch (e) { /* keep last value */ }
  }
  fetchYouTube();
  setInterval(fetchYouTube, 15000);

  // Smoothly roll the number toward the real count
  function rollSubs() {
    if (shown !== subs) {
      const step = Math.ceil(Math.abs(subs - shown) * 0.08);
      shown += Math.sign(subs - shown) * step;
      $('subsNum').textContent = shown.toLocaleString();
    }
    requestAnimationFrame(rollSubs);
  }
  rollSubs();

  /* ---------------- Night scene ---------------- */
  const cv = $('sky');
  const ctx = cv.getContext('2d');
  const aur = document.createElement('canvas');
  const actx = aur.getContext('2d');

  let W = 0, H = 0, K = 1;
  let skyGrad, stars = [], flakes = [], backTrees = [], frontTrees = [], glints = [], sparks = [];
  let hp = [0, 0, 0, 0];
  let santa = null, nextSanta = 3;
  let shoot = null, nextShoot = 5;
  const snowman = { x: 0 };

  const rand = (a, b) => a + Math.random() * (b - a);
  const farHill = (x) => H * 0.72 + Math.sin(x * 0.004 + hp[0]) * H * 0.03 + Math.sin(x * 0.011 + hp[1]) * H * 0.012;
  const ground = (x) => H * 0.86 + Math.sin(x * 0.003 + hp[2]) * H * 0.018 + Math.sin(x * 0.009 + hp[3]) * H * 0.007;

  function newFlake(anywhere) {
    const r = rand(0.6, 3.2);
    return { x: rand(0, W), y: anywhere ? rand(0, H) : rand(-40, -5), r, vy: 16 + r * 14, ph: rand(0, 6.28), sw: rand(8, 28) };
  }

  const LIGHT_COLORS = ['#ff4d4d', '#ffd84d', '#4dd2ff', '#7dff6b', '#ff7bf0'];

  function build() {
    hp = [rand(0, 6), rand(0, 6), rand(0, 6), rand(0, 6)];
    skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#020615');
    skyGrad.addColorStop(0.45, '#0a1838');
    skyGrad.addColorStop(0.8, '#1b2d5c');
    skyGrad.addColorStop(1, '#2a3f73');

    stars = Array.from({ length: Math.min(500, Math.round((W * H) / 2600)) }, () => ({
      x: rand(0, W), y: rand(0, H * 0.75), r: rand(0.3, 1.5), p: rand(0, 6.28), s: rand(0.6, 2.4),
    }));
    flakes = Array.from({ length: Math.min(450, Math.round((W * H) / 4500)) }, () => newFlake(true));

    snowman.x = W * (W < 700 ? 0.74 : 0.72);

    backTrees = [];
    for (let x = -20; x < W + 30; x += rand(14, 34) * K) {
      backTrees.push({ x, y: farHill(x) + 4 * K, h: rand(35, 75) * K });
    }

    frontTrees = [];
    for (let x = rand(-30, 20); x < W + 60; x += rand(70, 150) * K) {
      if (Math.abs(x - snowman.x) < 110 * K) continue;
      const lights = Math.random() < 0.6
        ? Array.from({ length: 16 }, () => ({ u: Math.random(), v: Math.random() * 2 - 1, c: LIGHT_COLORS[Math.floor(Math.random() * 5)], p: rand(0, 6.28) }))
        : null;
      frontTrees.push({ x, y: ground(x) + rand(10, 30) * K, h: rand(120, 210) * K, lights, star: false });
    }
    if (frontTrees.length) frontTrees.reduce((a, b) => (b.h > a.h ? b : a)).star = true;
    frontTrees.sort((a, b) => a.y - b.y);

    glints = Array.from({ length: 70 }, () => {
      const x = rand(0, W);
      return { x, y: rand(ground(x) + 4, H), p: rand(0, 6.28) };
    });

    aur.width = Math.ceil(W / 4);
    aur.height = Math.ceil(H / 4);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    K = Math.max(0.55, Math.min(1.4, H / 900));
    cv.width = W * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }
  window.addEventListener('resize', resize);
  resize();

  /* --- sky layers --- */
  function drawStars(t) {
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * s.s + s.p));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const RIBBONS = [
    { c: '90,255,170', y: 0.34, a: 0.06, len: 0.3, sp: 0.22, ph: 0 },
    { c: '60,220,255', y: 0.27, a: 0.05, len: 0.22, sp: -0.17, ph: 2 },
    { c: '190,120,255', y: 0.2, a: 0.04, len: 0.18, sp: 0.12, ph: 4 },
  ];

  function drawAurora(t) {
    const w = aur.width, h = aur.height;
    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.clearRect(0, 0, w, h);
    actx.globalCompositeOperation = 'lighter';
    for (const r of RIBBONS) {
      const len = h * r.len;
      const g = actx.createLinearGradient(0, -len, 0, 0);
      g.addColorStop(0, `rgba(${r.c},0)`);
      g.addColorStop(0.55, `rgba(${r.c},0.22)`);
      g.addColorStop(0.9, `rgba(${r.c},0.8)`);
      g.addColorStop(1, `rgba(${r.c},0)`);
      actx.fillStyle = g;
      for (let x = 0; x < w; x++) {
        const u = x / w;
        const y = h * r.y
          + Math.sin(u * 7 + t * r.sp + r.ph) * h * r.a
          + Math.sin(u * 19 - t * r.sp * 1.7 + r.ph) * h * r.a * 0.4;
        const b = 0.5 + 0.5 * Math.sin(u * 13 + t * 0.5 + r.ph * 1.3);
        actx.globalAlpha = 0.25 + 0.75 * b * b;
        actx.setTransform(1, 0, 0, 1, x, y);
        actx.fillRect(0, -len, 1.5, len);
      }
    }
    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.globalAlpha = 1;
    actx.globalCompositeOperation = 'source-over';

    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.85;
    ctx.drawImage(aur, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawMoon() {
    const x = W * 0.12, y = H * 0.17, r = 34 * K;
    const glow = ctx.createRadialGradient(x, y, r * 0.8, x, y, r * 4);
    glow.addColorStop(0, 'rgba(255,248,220,0.35)');
    glow.addColorStop(1, 'rgba(255,248,220,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
    g.addColorStop(0, '#fffdf2');
    g.addColorStop(1, '#efe4c0');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(190,175,140,0.35)';
    for (const [dx, dy, cr] of [[-0.3, -0.2, 0.18], [0.25, 0.1, 0.24], [-0.1, 0.4, 0.12], [0.35, -0.35, 0.1]]) {
      ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, cr * r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function updateShootingStar(dt) {
    nextShoot -= dt;
    if (!shoot && nextShoot <= 0) {
      shoot = { x: rand(W * 0.2, W), y: rand(0, H * 0.25), vx: -rand(500, 800), vy: rand(150, 300), life: 1 };
      nextShoot = rand(6, 14);
    }
    if (!shoot) return;
    shoot.x += shoot.vx * dt;
    shoot.y += shoot.vy * dt;
    shoot.life -= dt * 1.4;
    if (shoot.life <= 0) { shoot = null; return; }
    const tx = shoot.x - shoot.vx * 0.15, ty = shoot.y - shoot.vy * 0.15;
    const g = ctx.createLinearGradient(shoot.x, shoot.y, tx, ty);
    g.addColorStop(0, `rgba(255,255,255,${shoot.life})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(tx, ty); ctx.stroke();
  }

  /* --- Santa & reindeer --- */
  function drawDeer(dx, dy, t, ph, rudolph) {
    ctx.save();
    ctx.translate(dx, dy);
    const g = t * 11 + ph;
    ctx.strokeStyle = '#5a3418';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (const [bx, a, dir] of [[-12, g, -1], [-7, g + 0.7, -1], [9, g + Math.PI, 1], [14, g + Math.PI + 0.7, 1]]) {
      const s = Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(bx, 3);
      ctx.lineTo(bx + s * 7, 10);
      ctx.lineTo(bx + s * 10 + dir * 4, 17);
      ctx.stroke();
    }
    ctx.fillStyle = '#8b5a2b';
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9, -5); ctx.lineTo(19, -17); ctx.lineTo(25, -13); ctx.lineTo(17, 2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(24, -18, 7, 5, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(30, -15.5, 4.5, 3.2, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c99a63';
    ctx.beginPath(); ctx.ellipse(0, 4, 12, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f3e6d0';
    ctx.beginPath(); ctx.ellipse(-18, -4, 4, 3, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b4220';
    ctx.beginPath(); ctx.ellipse(18.5, -21, 4.5, 2, -0.7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(25.5, -19.5, 1.3, 0, Math.PI * 2); ctx.fill();
    // antlers
    ctx.strokeStyle = '#e0c38c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(22, -22); ctx.lineTo(19, -33);
    ctx.moveTo(20, -28); ctx.lineTo(14, -31);
    ctx.moveTo(19, -33); ctx.lineTo(23, -38);
    ctx.moveTo(19, -33); ctx.lineTo(15, -38);
    ctx.stroke();
    // collar with bells
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(13, -9); ctx.lineTo(18, -1); ctx.stroke();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(16, -3, 1.8, 0, Math.PI * 2); ctx.fill();
    // nose
    if (rudolph) {
      const glow = ctx.createRadialGradient(34, -16, 0, 34, -16, 12);
      glow.addColorStop(0, 'rgba(255,60,60,0.9)');
      glow.addColorStop(1, 'rgba(255,60,60,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(34, -16, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff2b2b';
      ctx.beginPath(); ctx.arc(34, -16, 2.8, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#2b1a0e';
      ctx.beginPath(); ctx.arc(34, -16, 1.7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawSleigh(t) {
    // gift sack and presents
    ctx.fillStyle = '#7a5230';
    ctx.beginPath(); ctx.ellipse(-32, -16, 12, 14, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2ecc71'; ctx.fillRect(-47, -22, 11, 11);
    ctx.fillStyle = '#4dabf7'; ctx.fillRect(-26, -26, 9, 9);
    ctx.fillStyle = '#ffd166'; ctx.fillRect(-42, -20, 2, 9); ctx.fillRect(-22, -26, 2, 9);
    // Santa
    ctx.fillStyle = '#d62828';
    ctx.beginPath(); ctx.ellipse(-10, -15, 11, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#d62828';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    const wave = Math.sin(t * 5) * 4;
    ctx.beginPath(); ctx.moveTo(-6, -20); ctx.lineTo(6, -14 + wave * 0.3); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(7, -14 + wave * 0.3, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f6c9a8';
    ctx.beginPath(); ctx.arc(-8, -32, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-5, -26, 7, 8, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-4, -33.5, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d62828';
    ctx.beginPath(); ctx.moveTo(-16, -36); ctx.lineTo(-1, -36); ctx.lineTo(-20, -50); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-17, -39, 17, 4);
    ctx.beginPath(); ctx.arc(-21, -50, 3, 0, Math.PI * 2); ctx.fill();
    // sleigh body
    ctx.fillStyle = '#b3121f';
    ctx.beginPath();
    ctx.moveTo(-52, -24);
    ctx.lineTo(-44, 8);
    ctx.lineTo(22, 8);
    ctx.quadraticCurveTo(36, 8, 36, -6);
    ctx.quadraticCurveTo(36, -13, 29, -12);
    ctx.lineTo(4, -4);
    ctx.lineTo(-36, -6);
    ctx.lineTo(-42, -24);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-50, -20); ctx.lineTo(-42, 4); ctx.lineTo(20, 4); ctx.stroke();
    // runners
    ctx.strokeStyle = '#e8c25a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-54, 17); ctx.lineTo(30, 17); ctx.quadraticCurveTo(46, 17, 43, 5);
    ctx.moveTo(-34, 8); ctx.lineTo(-34, 17);
    ctx.moveTo(10, 8); ctx.lineTo(10, 17);
    ctx.stroke();
  }

  function drawTeam(t) {
    const deer = [0, 1, 2, 3].map((i) => ({ x: 82 + i * 58, y: -6 + Math.sin(t * 6 + i * 0.9) * 3 }));
    ctx.strokeStyle = 'rgba(232,194,90,0.9)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(7, -14);
    for (const d of deer) ctx.lineTo(d.x + 15, d.y - 5);
    ctx.stroke();
    drawSleigh(t);
    deer.forEach((d, i) => drawDeer(d.x, d.y, t, i * 0.8, i === 3));
  }

  function updateSanta(dt) {
    nextSanta -= dt;
    if (!santa && nextSanta <= 0) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      santa = { dir, x: dir > 0 ? -320 * K : W + 320 * K, base: H * rand(0.22, 0.42), t: 0, speed: Math.max(170, W / 8) };
    }
    if (!santa) return;
    const s = santa;
    s.t += dt;
    s.x += s.dir * s.speed * dt;
    const y = s.base + Math.sin(s.t * 1.3) * H * 0.03;
    // magic sparkle trail from the back of the sleigh
    for (let i = 0; i < 3; i++) {
      sparks.push({ x: s.x - s.dir * 50 * K, y: y + rand(-8, 14) * K, vx: -s.dir * rand(10, 60), vy: rand(-15, 35), life: 1, r: rand(0.8, 2.4) });
    }
    ctx.save();
    ctx.translate(s.x, y);
    ctx.scale(s.dir * K, K);
    drawTeam(s.t);
    ctx.restore();
    if ((s.dir > 0 && s.x > W + 80 * K) || (s.dir < 0 && s.x < -80 * K)) {
      santa = null;
      nextSanta = rand(15, 35);
    }
  }

  function drawSparks(dt) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 0.7;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(255,${200 + Math.floor(55 * p.life)},120,${p.life})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * K, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* --- land --- */
  function fillCurve(fn, top, bottom, y0) {
    const g = ctx.createLinearGradient(0, y0, 0, H);
    g.addColorStop(0, top);
    g.addColorStop(1, bottom);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) ctx.lineTo(x, fn(x));
    ctx.lineTo(W + 8, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawTree(tr, green, snow, t) {
    const { x, y, h } = tr;
    const w = h * 0.6;
    ctx.fillStyle = '#3b2414';
    ctx.fillRect(x - w * 0.06, y - h * 0.12, w * 0.12, h * 0.14);
    for (let i = 0; i < 4; i++) {
      const top = y - h + i * h * 0.19;
      const bot = top + h * 0.36;
      const hw = w * (0.2 + i * 0.1);
      ctx.fillStyle = green;
      ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x + hw, bot); ctx.lineTo(x - hw, bot); ctx.closePath(); ctx.fill();
      const sb = top + (bot - top) * 0.45;
      const shw = hw * 0.45;
      const d = (bot - top) * 0.12;
      ctx.fillStyle = snow;
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x + shw, sb);
      ctx.quadraticCurveTo(x + shw * 0.5, sb + d, x, sb);
      ctx.quadraticCurveTo(x - shw * 0.5, sb + d, x - shw, sb);
      ctx.closePath();
      ctx.fill();
    }
    if (tr.lights) {
      for (const l of tr.lights) {
        const f = 0.18 + l.u * 0.72;
        const ly = y - h + f * h;
        const lx = x + l.v * f * 0.3 * h * 0.85;
        const a = 0.45 + 0.55 * Math.abs(Math.sin(t * 2 + l.p));
        ctx.globalAlpha = a * 0.35;
        ctx.fillStyle = l.c;
        ctx.beginPath(); ctx.arc(lx, ly, 5 * K, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(lx, ly, 2 * K, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (tr.star) drawStar(x, y - h, 9 * K, t);
  }

  function drawStar(x, y, r, t) {
    const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 3.5);
    glow.addColorStop(0, `rgba(255,220,100,${0.55 + 0.25 * Math.sin(t * 3)})`);
    glow.addColorStop(1, 'rgba(255,220,100,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, r * 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd84d';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.45 : r;
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawSnowman(t) {
    const x = snowman.x, k = K;
    const gy = ground(x) + 18 * k;
    const r1 = 48 * k, r2 = 35 * k, r3 = 25 * k;
    const c1 = gy - r1, c2 = c1 - r1 - r2 + 12 * k, c3 = c2 - r2 - r3 + 8 * k;

    ctx.fillStyle = 'rgba(40,60,120,0.3)';
    ctx.beginPath(); ctx.ellipse(x + 12 * k, gy - 2 * k, r1 * 1.3, 10 * k, 0, 0, Math.PI * 2); ctx.fill();

    // stick arms (right one waves)
    ctx.strokeStyle = '#4a2c17';
    ctx.lineWidth = 4 * k;
    ctx.lineCap = 'round';
    const lx = x - r2 * 2.1, ly = c2 - r2 * 0.9;
    ctx.beginPath();
    ctx.moveTo(x - r2 * 0.7, c2); ctx.lineTo(lx, ly);
    ctx.moveTo(lx + 8 * k, ly + 5 * k); ctx.lineTo(lx - 2 * k, ly + 10 * k);
    ctx.moveTo(lx, ly); ctx.lineTo(lx - 6 * k, ly - 6 * k);
    ctx.stroke();
    const a = -0.75 + Math.sin(t * 3) * 0.35;
    const ax = x + r2 * 0.7, ay = c2;
    const hx = ax + Math.cos(a) * r2 * 1.6, hy = ay + Math.sin(a) * r2 * 1.6;
    ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(hx, hy);
    ctx.moveTo(hx, hy); ctx.lineTo(hx + Math.cos(a - 0.6) * 10 * k, hy + Math.sin(a - 0.6) * 10 * k);
    ctx.moveTo(hx, hy); ctx.lineTo(hx + Math.cos(a + 0.6) * 10 * k, hy + Math.sin(a + 0.6) * 10 * k);
    ctx.stroke();

    const ball = (cx, cy, r) => {
      const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(1, '#b9cbe8');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    };
    ball(x, c1, r1);
    ball(x, c2, r2);
    ball(x, c3, r3);

    ctx.fillStyle = '#1b1b1f';
    for (const by of [c2 - r2 * 0.45, c2, c2 + r2 * 0.45, c1 - r1 * 0.35]) {
      ctx.beginPath(); ctx.arc(x, by, 3.6 * k, 0, Math.PI * 2); ctx.fill();
    }
    // face
    ctx.beginPath(); ctx.arc(x - r3 * 0.35, c3 - r3 * 0.22, 3 * k, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r3 * 0.35, c3 - r3 * 0.22, 3 * k, 0, Math.PI * 2); ctx.fill();
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.arc(x + i * r3 * 0.18, c3 + r3 * 0.42 + Math.abs(i) * -2.5 * k, 1.8 * k, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#ff8c1a';
    ctx.beginPath();
    ctx.moveTo(x, c3 - 3 * k); ctx.lineTo(x, c3 + 4 * k); ctx.lineTo(x + r3 * 1.15, c3 + 2 * k);
    ctx.closePath(); ctx.fill();

    // scarf
    const sy = c3 + r3 * 0.78;
    ctx.fillStyle = '#d62828';
    ctx.beginPath(); ctx.ellipse(x, sy, r3 * 1.02, 6 * k, 0, 0, Math.PI * 2); ctx.fill();
    const sway = Math.sin(t * 2) * 3 * k;
    ctx.beginPath();
    ctx.moveTo(x + r3 * 0.3, sy);
    ctx.lineTo(x + r3 * 0.75, sy);
    ctx.lineTo(x + r3 * 0.85 + sway, sy + 30 * k);
    ctx.lineTo(x + r3 * 0.4 + sway, sy + 30 * k);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + r3 * 0.45 + sway * 0.6, sy + 14 * k, r3 * 0.4, 3 * k);
    ctx.fillRect(x + r3 * 0.47 + sway * 0.9, sy + 22 * k, r3 * 0.4, 3 * k);

    // top hat
    const hb = c3 - r3 * 0.72;
    ctx.fillStyle = '#16161c';
    ctx.beginPath(); ctx.ellipse(x, hb, r3 * 1.1, 4.5 * k, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(x - r3 * 0.7, hb - r3 * 1.25, r3 * 1.4, r3 * 1.25);
    ctx.fillStyle = '#d62828';
    ctx.fillRect(x - r3 * 0.7, hb - r3 * 0.42, r3 * 1.4, r3 * 0.25);
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath(); ctx.arc(x + r3 * 0.45, hb - r3 * 0.3, 3.5 * k, 0, Math.PI * 2); ctx.fill();
  }

  function drawSnow(dt, t) {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      f.y += f.vy * dt;
      f.x += Math.sin(t * 0.8 + f.ph) * f.sw * dt + 6 * dt;
      if (f.y > H + 5) { flakes[i] = newFlake(false); continue; }
      if (f.x > W + 5) f.x = -5;
      ctx.globalAlpha = 0.45 + f.r * 0.17;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* --- main loop --- */
  let last = performance.now();
  let T = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    T += dt;

    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);
    drawStars(T);
    drawAurora(T);
    drawMoon();
    updateShootingStar(dt);
    updateSanta(dt);
    drawSparks(dt);

    fillCurve(farHill, '#9db2df', '#3d4f86', H * 0.68);
    for (const tr of backTrees) drawTree(tr, '#16344d', '#a9bde0', T);
    fillCurve(ground, '#f2f7ff', '#b8c9ea', H * 0.84);
    for (const g of glints) {
      ctx.globalAlpha = Math.max(0, Math.sin(T * 2.5 + g.p));
      ctx.fillStyle = '#fff';
      ctx.fillRect(g.x, g.y, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;

    const behind = frontTrees.filter((tr) => tr.y < ground(snowman.x) + 18 * K);
    const front = frontTrees.filter((tr) => tr.y >= ground(snowman.x) + 18 * K);
    for (const tr of behind) drawTree(tr, '#0f4a2e', '#f4f8ff', T);
    drawSnowman(T);
    for (const tr of front) drawTree(tr, '#0f4a2e', '#f4f8ff', T);

    drawSnow(dt, T);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
